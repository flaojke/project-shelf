name: Private Windows review build

# This workflow has no automatic push or pull-request trigger.
on:
  workflow_dispatch:
    inputs:
      free_quota_confirmed:
        description: 'I verified remaining included compute/storage and that paid overages are blocked.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-windows-review
  cancel-in-progress: true

jobs:
  windows-review:
    if: ${{ github.event.repository.private == true && inputs.free_quota_confirmed == true }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve the exact committed source and legal text bytes
        run: git -c core.autocrlf=false checkout-index --all --force

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Verify the source and empty public profiles
        run: node scripts/ci-verify.mjs source

      - name: Prepare the isolated build directories and path remapping
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'project-shelf-target'
          $output = Join-Path $env:RUNNER_TEMP 'project-shelf-review'
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHELF_REVIEW_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:CARGO_HOME, (Join-Path $env:USERPROFILE '.cargo'), $env:USERPROFILE)
          $flags = @()
          foreach ($root in $roots) {
            if ($root) {
              $flags += "--remap-path-prefix=$root=build-source"
              $flags += "--remap-path-prefix=$($root.Replace('\','/'))=build-source"
            }
          }
          "CARGO_ENCODED_RUSTFLAGS=$($flags -join [char]31)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Check the CI verifier and JavaScript mock tests
        run: |
          node --test scripts/ci-verify.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE

      - name: Check the browser UI with mock IPC
        run: npm run test:ui

      - name: Set up the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Run native unit tests without user systems
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build the Windows application and NSIS installer
        run: npm run desktop:build -- --ci

      - name: Read the binary versions and signing status without starting them
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/project-shelf.exe'
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $items = @()
          $paths = @($exe, $installers[0].FullName)
          $names = @('Project Shelf.exe', 'Project Shelf-setup.exe')
          for ($index = 0; $index -lt $paths.Count; $index++) {
            $info = (Get-Item -LiteralPath $paths[$index]).VersionInfo
            $status = (Get-AuthenticodeSignature -LiteralPath $paths[$index]).Status.ToString()
            $items += [pscustomobject]@{file=$names[$index]; fileVersion=$info.FileVersion; productVersion=$info.ProductVersion; signatureStatus=$status; sha256=(Get-FileHash -LiteralPath $paths[$index] -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $items | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'project-shelf-binary-info.json') -Encoding utf8

      - name: Audit and assemble the review package
        run: node scripts/ci-verify.mjs package

      - name: Store the checked review package for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-shelf-windows-${{ github.sha }}
          path: ${{ env.SHELF_REVIEW_OUTPUT }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: false
